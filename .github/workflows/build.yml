name: Build Android APK v1.4.0

on:
  push:
    branches: [ v1.4, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zip \
          unzip
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Setup Android SDK
      run: |
        # Use system Android SDK
        export ANDROID_SDK=/usr/local/lib/android/sdk
        export ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Accept licenses
        yes | $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required packages
        $ANDROID_SDK/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        
        # Create buildozer directory structure
        mkdir -p ~/.buildozer/android/platform/
        ln -sf $ANDROID_SDK ~/.buildozer/android/platform/android-sdk
    
    - name: Build APK
      run: |
        export ANDROID_SDK=/usr/local/lib/android/sdk
        export ANDROID_HOME=/usr/local/lib/android/sdk
        buildozer android debug
      timeout-minutes: 60
      env:
        ANDROID_SDK: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: surgerycam-v1.4.0-apk
        path: bin/*.apk
        if-no-files-found: warn
