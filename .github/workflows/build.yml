name: Build Android APK v1.4.0

on:
  push:
    branches: [ v1.4, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          automake \
          libtool \
          pkg-config \
          zip \
          unzip
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer cython
    
    - name: Setup Android SDK for buildozer
      run: |
        # Create buildozer directory structure
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # Copy system SDK to buildozer location
        cp -r /usr/local/lib/android/sdk/cmdline-tools/latest ~/.buildozer/android/platform/android-sdk/cmdline-tools/
        
        # Create tools/bin directory structure that buildozer expects
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # Create sdkmanager wrapper
        cat > ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager << 'EOF'
#!/bin/bash
exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"
EOF
        chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Create avdmanager wrapper
        cat > ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager << 'EOF'
#!/bin/bash
exec /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager "$@"
EOF
        chmod +x ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
        
        # Accept licenses
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        
        # Install required packages
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.0" || true
        
        # Verify setup
        ls -la ~/.buildozer/android/platform/android-sdk/tools/bin/
    
    - name: Build APK
      run: |
        buildozer android debug
      timeout-minutes: 60
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: surgerycam-v1.4.0-apk
        path: bin/*.apk
        if-no-files-found: warn
