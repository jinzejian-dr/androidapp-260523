name: Build Android APK v1.4.0

on:
  push:
    branches: [ v1.4, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libtool autoconf automake pkg-config libffi-dev libssl-dev
        pip install buildozer cython
    
    - name: Build APK
      run: buildozer android debug
      env:
        ANDROID_SDK: ~/.buildozer/android/platform/android-sdk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: surgerycam-v1.4.0-apk
        path: bin/*.apk
